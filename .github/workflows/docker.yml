name: Docker
# En cada cambio: construye la imagen y la prueba (sin publicarla).
# Al publicar una release: la prueba y, solo si funciona, la publica en ghcr.io.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen de prueba
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cuantario:prueba

      - name: Prueba de humo
        run: |
          docker run --rm cuantario:prueba --version
          docker run --rm cuantario:prueba --demo
          test "$(docker run --rm --entrypoint id cuantario:prueba -u)" = "10001"   # no se ejecuta como root

      - name: Etiquetas de versión
        if: github.event_name == 'release'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Iniciar sesión en ghcr.io
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
