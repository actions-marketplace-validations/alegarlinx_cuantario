name: "Cuantario PQC Scanner"
description: "Inventario criptográfico y priorización post-cuántica con políticas europeas (UE / CCN)"
author: "Alejandro Garcia Linero"
branding:
  icon: "shield"
  color: "blue"

inputs:
  ruta:
    description: "Carpeta a analizar"
    default: "."
  perfil:
    description: "eu o ccn"
    default: "eu"
  riesgo:
    description: "alto o medio"
    default: "alto"
  confianza-min:
    description: "alta, media o baja"
    default: "media"
  fail-on:
    description: "Hacer fallar el job si hay hallazgos de esta prioridad o superior (CRITICO, ALTO, MEDIO, BAJO). Vacío: nunca"
    default: ""
  salida:
    description: "Prefijo de los ficheros de salida"
    default: "cuantario"

outputs:
  sarif:
    description: "Ruta del informe SARIF"
    value: ${{ steps.scan.outputs.sarif }}
  cbom:
    description: "Ruta del CBOM CycloneDX"
    value: ${{ steps.scan.outputs.cbom }}
  informe:
    description: "Ruta del informe en Markdown"
    value: ${{ steps.scan.outputs.informe }}

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Instalar Cuantario
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Analizar
      id: scan
      shell: bash
      # Las entradas se pasan como variables de entorno, nunca interpoladas en el script,
      # para evitar inyección de comandos.
      env:
        IN_RUTA: ${{ inputs.ruta }}
        IN_PERFIL: ${{ inputs.perfil }}
        IN_RIESGO: ${{ inputs.riesgo }}
        IN_CONFIANZA: ${{ inputs.confianza-min }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_SALIDA: ${{ inputs.salida }}
      run: |
        args=("$IN_RUTA" --perfil "$IN_PERFIL" --riesgo "$IN_RIESGO" --confianza-min "$IN_CONFIANZA"
              --salida "$IN_SALIDA" --sarif "$IN_SALIDA.sarif")
        if [ -n "$IN_FAIL_ON" ]; then args+=(--fail-on "$IN_FAIL_ON"); fi
        {
          echo "sarif=$IN_SALIDA.sarif"
          echo "cbom=${IN_SALIDA}_cbom.json"
          echo "informe=${IN_SALIDA}_informe.md"
        } >> "$GITHUB_OUTPUT"
        set +e
        cuantario "${args[@]}"
        status=$?
        cat "${IN_SALIDA}_informe.md" >> "$GITHUB_STEP_SUMMARY"
        exit $status
